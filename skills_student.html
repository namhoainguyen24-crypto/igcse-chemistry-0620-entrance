<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambridge IGCSE Chemistry (0620) — Student Skills Test (Set B)</title>
<style>

  :root {
    --primary: #7c2d12;
    --accent: #b45309;
    --bg: #f8f5f2;
    --card: #ffffff;
    --border: #e5ddd5;
    --text: #1e293b;
    --muted: #64748b;
    --core-bg: #e0f2fe;
    --core-fg: #0369a1;
    --ext-bg: #fae8ff;
    --ext-fg: #86198f;
    --atp-bg: #fef3c7;
    --atp-fg: #92400e;
    --ms-bg: #f0fdf4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .hidden { display: none !important; }

  .builder-panel {
    max-width: 1120px;
    margin: 20px auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    padding: 20px 24px;
  }
  .panel-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 2px solid var(--bg);
    padding-bottom: 14px;
    margin-bottom: 16px;
  }
  .panel-header h1 { margin: 0; font-size: 1.3rem; color: var(--primary); }
  .panel-header p { margin: 2px 0 0; font-size: 0.85rem; color: var(--muted); }
  .header-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn-print {
    background: var(--primary); color: #fff; border: none; padding: 9px 15px;
    border-radius: 8px; font-weight: 600; font-size: 0.88rem; cursor: pointer;
  }
  .btn-print:hover { background: #5c1d0c; }
  .btn-share {
    background: #0f766e; color: #fff; border: none; padding: 9px 15px;
    border-radius: 8px; font-weight: 600; font-size: 0.88rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .btn-share:hover { opacity: 0.92; }

  .section-label {
    font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--muted); margin: 14px 0 8px;
  }
  .paper-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px;
  }
  .paper-btn {
    text-align: left; background: #fafaf9; border: 1.5px solid var(--border);
    border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: all 0.15s;
  }
  .paper-btn:hover { border-color: var(--accent); }
  .paper-btn.active { background: #fffbeb; border-color: var(--accent); box-shadow: 0 2px 8px rgba(180,83,9,0.12); }
  .paper-btn .p-title { display: block; font-weight: 700; font-size: 0.9rem; color: var(--primary); }
  .paper-btn .p-sub { display: block; font-size: 0.76rem; color: var(--muted); margin-top: 2px; }

  .controls-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .seg-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg-btn {
    padding: 6px 11px; border: 1px solid var(--border); background: #f8fafc;
    border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
  }
  .seg-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .appendix-toggles { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 0.85rem; }
  .appendix-toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

  .meta-inputs {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px;
  }
  .meta-field label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
  .meta-field input { width: 100%; padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.86rem; }

  .skill-matrix {
    margin-top: 14px; padding: 12px 14px; border-radius: 8px; background: #fafaf9; border: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px;
  }
  .skill-pill {
    background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 0.82rem;
  }
  .skill-pill strong { color: var(--primary); display: block; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; background: #0f172a; color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 0.88rem; font-weight: 600;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.24); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  .online-toolbar {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 10px; background: #f1f5f9; border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
  }
  .timer-pill {
    display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--primary);
    border: 1px solid var(--border); padding: 5px 10px; border-radius: 8px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 0.92rem;
  }
  .timer-pill.urgent { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
  .btn-mini {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 5px 10px; border-radius: 5px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
  }
  .btn-mini:hover { border-color: var(--accent); color: var(--accent); }
  .btn-submit-online {
    background: #16a34a; color: #fff; border: none; padding: 7px 14px;
    border-radius: 7px; font-size: 0.86rem; font-weight: 700; cursor: pointer;
  }
  .btn-submit-online:hover { background: #15803d; }

  .report-banner {
    border: 2px solid #0f172a; border-radius: 10px; padding: 16px 18px; margin-bottom: 18px; background: #f8fafc;
  }
  .report-banner h2 {
    margin: 0 0 8px; font-size: 1.05rem; color: var(--primary);
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px;
  }
  .report-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 10px 0;
  }
  .stat-pill { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; text-align: center; }
  .stat-pill .lbl { font-size: 0.74rem; color: var(--muted); font-weight: 600; }
  .stat-pill .val { font-size: 1.02rem; font-weight: 800; color: var(--primary); }
  .calc-result { margin-top: 8px; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; }
  .band-wait { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
  .band-1 { background: #fee2e2; color: #991b1b; }
  .band-2 { background: #fef3c7; color: #92400e; }
  .band-3 { background: #dbeafe; color: #1e40af; }
  .band-4 { background: #dcfce7; color: #166534; }

  /* ---- EXAM PAPER ---- */
  .paper-sheet {
    max-width: 900px; margin: 20px auto 50px; background: #fff; border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08); padding: 34px 42px;
  }
  .cam-header { border: 2px solid #0f172a; padding: 14px 18px; margin-bottom: 20px; }
  .cam-header-top {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    border-bottom: 1.5px solid #0f172a; padding-bottom: 8px; margin-bottom: 10px;
  }
  .cam-title { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; }
  .cam-sub { font-size: 0.86rem; font-weight: 600; color: #334155; }
  .cam-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; font-size: 0.88rem; }
  .cam-instructions { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #94a3b8; font-size: 0.82rem; color: #334155; }

  .q-card {
    margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1.5px solid #e2e8f0;
    break-inside: avoid; page-break-inside: avoid;
  }
  .q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .q-num { font-weight: 800; font-size: 1rem; color: #0f172a; }
  .q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex-shrink: 0; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; }
  .badge-core { background: var(--core-bg); color: var(--core-fg); }
  .badge-ext { background: var(--ext-bg); color: var(--ext-fg); }
  .badge-atp { background: var(--atp-bg); color: var(--atp-fg); }
  .badge-src { background: #f1f5f9; color: #334155; font-weight: 600; }
  .badge-ao { background: #ede9fe; color: #5b21b6; font-weight: 700; }
  .badge-wait { background: #fef9c3; color: #854d0e; font-size: 0.72rem; padding: 1px 7px; border-radius: 999px; font-weight: 700; }
  .marks-tag { font-weight: 700; font-size: 0.85rem; color: #0f172a; }

  .subpart { margin: 10px 0 10px 14px; font-size: 0.93rem; }
  .subpart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .write-lines { margin: 6px 0 8px; }
  .write-line { border-bottom: 1px dotted #94a3b8; height: 22px; width: 100%; }

  textarea.online-ta {
    width: 100%; min-height: 54px; margin: 6px 0; padding: 8px 10px;
    border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 0.9rem; resize: vertical; background: #f8fafc;
  }
  textarea.online-ta:focus { outline: none; border-color: var(--accent); background: #fff; }
  textarea.online-ta[readonly] { background: #f1f5f9; color: #334155; cursor: not-allowed; }
  .print-ans {
    display: none; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 5px;
    padding: 6px 9px; margin: 6px 0; font-size: 0.88rem; white-space: pre-wrap;
  }

  .svg-wrap { margin: 10px 0; text-align: center; }
  .svg-wrap svg { max-width: 100%; height: auto; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; }

  table.exam-tbl { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 0.86rem; }
  table.exam-tbl th, table.exam-tbl td { border: 1px solid #64748b; padding: 5px 8px; text-align: left; }
  table.exam-tbl th { background: #f1f5f9; font-weight: 700; }

  .appendix-page {
    page-break-before: always; break-before: page; margin-top: 28px;
    padding-top: 16px; border-top: 2px solid #0f172a; scroll-margin-top: 72px;
  }
  .pt-grid { display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); gap: 2px; margin: 10px 0; font-size: 0.62rem; }
  .pt-cell {
    border: 1px solid #475569; padding: 3px 1px; text-align: center; line-height: 1.15;
    min-height: 38px; display: flex; flex-direction: column; justify-content: center; background: #fff;
  }
  .pt-cell b { font-size: 0.72rem; }
  .pt-empty { border: none; background: transparent; }
  .pt-hdr { border: none; font-weight: 700; font-size: 0.68rem; min-height: 18px; background: #f1f5f9; }

  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .paper-sheet { max-width: 100%; margin: 0; padding: 0; border: none; box-shadow: none; }
    textarea.online-ta { display: none !important; }
    .print-ans { display: block !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }

.student-topbar {
  position: sticky; top: 0; z-index: 500; background: #0f172a; color: #fff;
  padding: 10px 18px; box-shadow: 0 3px 12px rgba(15, 23, 42, 0.18);
}
.student-topbar-inner {
  max-width: 960px; margin: 0 auto; display: flex; flex-wrap: wrap;
  justify-content: space-between; align-items: center; gap: 10px;
}
.student-inputs-inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.student-inputs-inline input {
  padding: 5px 9px; border-radius: 6px; border: 1px solid #475569;
  background: #1e293b; color: #fff; font-size: 0.84rem; width: 165px;
}
.student-inputs-inline input::placeholder { color: #94a3b8; }
.student-topbar .timer-pill { background: #1e293b; color: #fff; border-color: #334155; }
.student-topbar .timer-pill.urgent { background: #7f1d1d; border-color: #ef4444; color: #fff; }
.student-topbar .btn-mini { background: #334155; color: #fff; border-color: #475569; }
</style>
</head>
<body>

<div class="student-topbar no-print" id="studentTopbar">
  <div class="student-topbar-inner">
    <div class="student-inputs-inline">
      <strong style="font-size:0.9rem;">0620 Skills (Set B)</strong>
      <input type="text" id="stName" placeholder="Họ tên học sinh...">
      <input type="text" id="stSchool" placeholder="Trường đang học...">
    </div>
    <div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
      <div class="timer-pill" id="stTimerPill">⏱️ <span id="stTimerText">45:00</span></div>
      <button class="btn-mini" id="btnStStartTimer" onclick="startStudentTimer()">▶️ Bắt đầu tính giờ</button>
      <button class="btn-mini" id="btnJumpPT" onclick="jumpTo('appendix-pt')">Periodic Table</button>
      <button class="btn-mini" id="btnJumpQA" onclick="jumpTo('appendix-qa')">QA Notes</button>
      <button class="btn-submit-online" id="btnStSubmit" onclick="submitOnlineExam(false)">🚀 Nộp bài</button>
      <button class="btn-mini" onclick="window.print()">🖨️ In / PDF</button>
    </div>
  </div>
</div>

<div class="paper-sheet" id="paperSheet"></div>
<div class="toast no-print" id="toastBox"></div>

<script>
const SVGS = {

  "m26RateGraph": "<svg viewBox=\"0 0 430 230\" width=\"390\" xmlns=\"http://www.w3.org/2000/svg\">\n    <line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"190\" stroke=\"#0f172a\" stroke-width=\"2\"/>\n    <line x1=\"60\" y1=\"190\" x2=\"400\" y2=\"190\" stroke=\"#0f172a\" stroke-width=\"2\"/>\n    <text x=\"18\" y=\"105\" font-size=\"10.5\" font-weight=\"bold\" transform=\"rotate(-90 18,105)\" text-anchor=\"middle\">Time to collect 50 cm³ CO₂ / s</text>\n    <text x=\"230\" y=\"218\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\">Volume of distilled water added / cm³</text>\n    <line x1=\"60\" y1=\"154\" x2=\"400\" y2=\"154\" stroke=\"#e2e8f0\"/><text x=\"53\" y=\"158\" font-size=\"9.5\" text-anchor=\"end\">50</text>\n    <line x1=\"60\" y1=\"118\" x2=\"400\" y2=\"118\" stroke=\"#e2e8f0\"/><text x=\"53\" y=\"122\" font-size=\"9.5\" text-anchor=\"end\">100</text>\n    <line x1=\"60\" y1=\"82\" x2=\"400\" y2=\"82\" stroke=\"#e2e8f0\"/><text x=\"53\" y=\"86\" font-size=\"9.5\" text-anchor=\"end\">150</text>\n    <line x1=\"60\" y1=\"46\" x2=\"400\" y2=\"46\" stroke=\"#e2e8f0\"/><text x=\"53\" y=\"50\" font-size=\"9.5\" text-anchor=\"end\">200</text>\n    <text x=\"53\" y=\"193\" font-size=\"9.5\" text-anchor=\"end\">0</text>\n    <text x=\"100\" y=\"203\" font-size=\"9.5\" text-anchor=\"middle\">30</text>\n    <text x=\"155\" y=\"203\" font-size=\"9.5\" text-anchor=\"middle\">35</text>\n    <text x=\"210\" y=\"203\" font-size=\"9.5\" text-anchor=\"middle\">40</text>\n    <text x=\"265\" y=\"203\" font-size=\"9.5\" text-anchor=\"middle\">45</text>\n    <text x=\"320\" y=\"203\" font-size=\"9.5\" text-anchor=\"middle\">50</text>\n    <text x=\"375\" y=\"203\" font-size=\"9.5\" text-anchor=\"middle\">55</text>\n    <line x1=\"155\" y1=\"25\" x2=\"155\" y2=\"190\" stroke=\"#cbd5e1\" stroke-dasharray=\"4,3\"/>\n    <path d=\"M100,176 C150,170 210,158 265,137 C320,104 352,70 375,42\" fill=\"none\" stroke=\"#b45309\" stroke-width=\"2.5\"/>\n    <circle cx=\"100\" cy=     localStorage.setItem(STORAGE_KEY, JSON.stringify({
      studentName: state.studentName,
      studentSchool: state.studentSchool,
      answers: state.answers,
      submitted: state.submitted,
      timedOut: state.timedOut,
      startedAt: state.startedAt,
      deadlineAt: state.deadlineAt,
      elapsedSeconds: state.elapsedSeconds,
      tokenCopied: state.tokenCopied
    }));
  } catch (e) {}
}

function escHtml(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function showToast(msg) {
  const box = document.getElementById("toastBox");
  box.textContent = msg;
  box.classList.add("show");
  setTimeout(() => box.classList.remove("show"), 2600);
}

function toBase64Utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

function getActivePaper() {
  return PAPERS.find(p => p.id === state.paperId) || PAPERS[0];
}

function parseUrlParams() {
  const p = new URLSearchParams(window.location.search);
  let customTime = false;
  if (p.has("paper") && PAPERS.some(x => x.id === p.get("paper").toUpperCase())) {
    state.paperId = p.get("paper").toUpperCase();
  }
  if (p.has("pt")) state.showPT = p.get("pt") !== "0";
  if (p.has("qa")) state.showQA = p.get("qa") !== "0";
  if (p.has("time")) {
    const t = parseInt(p.get("time"), 10);
    if (t >= 10 && t <= 120) { state.timeMinutes = t; customTime = true; }
  }
  if (!customTime) state.timeMinutes = getActivePaper().defaultTime;
  state.timerSeconds = state.timeMinutes * 60;
  const now = new Date();
  state.examDate = String(now.getDate()).padStart(2,"0") + "/" + String(now.getMonth()+1).padStart(2,"0") + "/" + now.getFullYear();
}

function formatTime(sec) {
  return String(Math.floor(sec / 60)).padStart(2,"0") + ":" + String(sec % 60).padStart(2,"0");
}

function updateTimerDisplays() {
  const el = document.getElementById("stTimerText");
  const pill = document.getElementById("stTimerPill");
  if (el) el.textContent = formatTime(state.timerSeconds);
  if (pill) pill.classList.toggle("urgent", state.timerSeconds <= 300);
}

function syncWallClock() {
  if (!state.startedAt || !state.deadlineAt || state.submitted) return;
  const now = Date.now();
  state.elapsedSeconds = Math.max(0, Math.floor((now - state.startedAt) / 1000));
  state.timerSeconds = Math.max(0, Math.ceil((state.deadlineAt - now) / 1000));
  updateTimerDisplays();
  if (now >= state.deadlineAt) {
    submitOnlineExam(true);
  }
}

function startStudentTimer() {
  if (state.timerRunning || state.submitted) return;
  if (!state.startedAt) {
    state.startedAt = Date.now();
    state.deadlineAt = state.startedAt + state.timeMinutes * 60 * 1000;
    saveDraft();
  }
  state.timerRunning = true;
  const btn = document.getElementById("btnStStartTimer");
  if (btn) btn.classList.add("hidden");
  syncWallClock();
  if (!state.submitted) {
    state.timerInterval = setInterval(syncWallClock, 500);
  }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.timerRunning && !state.submitted) syncWallClock();
});

window.addEventListener("beforeunload", e => {
  const hasWork = state.timerRunning || Object.keys(state.answers).length > 0;
  if ((!state.submitted && hasWork) || (state.submitted && !state.tokenCopied)) {
    e.preventDefault();
    e.returnValue = "";
  }
});

function jumpTo(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: "smooth" });
}

function buildSubmissionToken() {
  return toBase64Utf8(JSON.stringify({
    pack: "B",
    paperId: state.paperId,
    time: state.timeMinutes,
    pt: state.showPT,
    qa: state.showQA,
    name: state.studentName,
    school: state.studentSchool,
    date: state.examDate,
    startedAt: state.startedAt,
    submittedAt: Date.now(),
    elapsedSeconds: state.elapsedSeconds,
    answers: state.answers
  }));
}

function copySubmissionToken() {
  const token = buildSubmissionToken();
  state.tokenCopied = true;
  saveDraft();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(token).then(() => showToast("Đã copy Mã Bài Làm Set B! Hãy gửi ngay cho Giáo viên.")).catch(() => window.prompt("Copy Mã Bài Làm:", token));
  } else {
    window.prompt("Copy Mã Bài Làm:", token);
  }
}

function downloadSubmissionFile() {
  const token = buildSubmissionToken();
  state.tokenCopied = true;
  saveDraft();
  const safeName = (state.studentName || "hoc_sinh").trim().replace(/[^a-zA-Z0-9_-]+/g, "_");
  const content = [
    "IGCSE Chemistry (0620) - Set B Submission (" + state.paperId + ")",
    "Candidate: " + (state.studentName || "(unnamed)"),
    "School: " + (state.studentSchool || "(unspecified)"),
    "Paper: " + state.paperId,
    "Time Limit: " + state.timeMinutes + " mins",
    "Time Spent: " + formatTime(state.elapsedSeconds),
    "",
    "--- SUBMISSION TOKEN (Paste in Teacher App -> Nhap Ma Bai Lam) ---",
    token
  ].join("\n");
  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "IGCSE_0620_SetB_" + state.paperId + "_" + safeName + ".txt";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast("Đã tải file .txt dự phòng chứa Mã Bài Làm!");
}

function submitOnlineExam(isTimeout = false) {
  if (state.submitted) return;
  clearInterval(state.timerInterval);
  state.timerRunning = false;
  if (state.startedAt) {
    state.elapsedSeconds = Math.max(state.elapsedSeconds, Math.floor((Date.now() - state.startedAt) / 1000));
  }
  state.submitted = true;
  state.timedOut = !!isTimeout;
  saveDraft();
  const stBtn = document.getElementById("btnStSubmit");
  if (stBtn) { stBtn.disabled = true; stBtn.textContent = "✅ Đã nộp bài"; }
  const startBtn = document.getElementById("btnStStartTimer");
  if (startBtn) startBtn.classList.add("hidden");
  document.getElementById("stName").readOnly = true;
  document.getElementById("stSchool").readOnly = true;
  renderPaper();
  window.scrollTo({ top: 0, behavior: "smooth" });
  showToast(isTimeout ? "⏰ Hết giờ — bài làm đã tự động khóa và nộp!" : "✅ Đã nộp bài thành công!");
}

function setTextAnswer(key, val) {
  if (state.submitted) return;
  if (!state.timerRunning) startStudentTimer();
  state.answers[key] = val;
  saveDraft();
  const pa = document.getElementById("pa_" + key);
  if (pa) pa.textContent = val || "(No written answer)";
}

  let cells = groups.map(g => '<div class="pt-cell pt-hdr">' + g + '</div>').join("");
  PT_DATA.forEach(el => {
    cells += !el ? '<div class="pt-cell pt-empty"></div>' : '<div class="pt-cell"><span>' + el[0] + '</span><b>' + el[1] + '</b><span>' + el[2] + '</span></div>';
  });

}

blue ppt., insoluble in excess</td><td>light blue ppt., soluble in excess → dark blue solution</td></tr>\n    <tr><td>iron(II), Fe²⁺</td><td>green ppt., insoluble in excess</td><td>green ppt., insoluble in excess</td></tr>\n    <tr><td>iron(III), Fe³⁺</td><td>red-brown ppt., insoluble in excess</td><td>red-brown ppt., insoluble in excess</td></tr>\n    <tr><td>zinc, Zn²⁺</td><td>white ppt., soluble in excess → colourless</td><td>white ppt., soluble in excess → colourless</td></tr></table>\n    <div style=\"display:grid; grid-template-columns:1.2fr 1fr; gap:12px;\">\n    <table class=\"exam-tbl\"><tr><th colspan=\"2\">Tests for gases</th></tr>\n    <tr><td>ammonia, NH₃</td><td>turns damp red litmus paper blue</td></tr>\n    <tr><td>carbon dioxide, CO₂</td><td>turns limewater milky</td></tr>\n    <tr><td>chlorine, Cl₂</td><td>bleaches damp litmus paper</td></tr>\n    <tr><td>hydrogen, H₂</td><td>'pops' with a lighted splint</td></tr>\n    <tr><td>oxygen, O₂</td><td>relights a glowing splint</td></tr>\n    <tr><td>sulfur dioxide, SO₂</td><td>turns acidified KMnO₄(aq) purple to colourless</td></tr></table>\n    <table class=\"exam-tbl\"><tr><th colspan=\"2\">Flame tests</th></tr>\n    <tr><td>Li⁺</td><td>red</td></tr><tr><td>Na⁺</td><td>yellow</td></tr><tr><td>K⁺</td><td>lilac</td></tr>\n    <tr><td>Ca²⁺</td><td>orange-red</td></tr><tr><td>Ba²⁺</td><td>light green</td></tr><tr><td>Cu²⁺</td><td>blue-green</td></tr></table></div></div>";

function renderPaper() {
  const p = getActivePaper();
  const sName = escHtml(state.studentName) || "___________________________________";
  const sSchool = escHtml(state.studentSchool) || "_________________________";
  let totalMarks = 0;
  p.questions.forEach(q => q.parts.forEach(pt => totalMarks += pt.marks));

  let html = "";
  if (state.submitted) {
    const answered = Object.keys(state.answers).filter(k => String(state.answers[k] || "").trim().length > 0).length;
    const tokStr = buildSubmissionToken();
    html += '<div class="report-banner">' +
      '<h2><span>' + (state.timedOut ? "⏰ Hết giờ — Bài làm đã tự động khóa và nộp!" : "✅ Đã nộp bài thành công!") + '</span>' +
      '<span class="no-print" style="display:flex; gap:8px; flex-wrap:wrap;">' +
      '<button class="btn-share" style="padding:6px 12px; font-size:0.82rem;" onclick="copySubmissionToken()">📋 Copy Mã Bài Làm gửi Giáo viên</button>' +
      '<button class="btn-mini" style="padding:6px 12px; font-size:0.82rem;" onclick="downloadSubmissionFile()">💾 Tải file .txt dự phòng</button>' +
      '<button class="btn-print" style="padding:6px 12px; font-size:0.82rem;" onclick="window.print()">🖨️ In / Lưu PDF bài làm</button>' +
      '</span></h2>' +
      '<div class="report-stats">' +
      '<div class="stat-pill"><div class="lbl">Số ý đã trả lời</div><div class="val">' + answered + ' ý</div></div>' +
      '<div class="stat-pill"><div class="lbl">Thời gian làm bài</div><div class="val">' + formatTime(state.elapsedSeconds) + '</div></div>' +
      '<div class="stat-pill"><div class="lbl">Trạng thái</div><div class="val">⏳ Chờ giáo viên chấm</div></div>' +
      '</div>' +
      '<div class="calc-result band-wait">⚠️ <strong>QUAN TRỌNG: Bài làm mới chỉ lưu trên máy của bạn!</strong> Hãy bấm <strong>📋 Copy Mã Bài Làm</strong> (hoặc <strong>💾 Tải file .txt</strong>) và gửi ngay cho Giáo viên. Nếu có câu vẽ hình trên giấy, hãy chụp ảnh gửi kèm.</div>' +
      '<textarea class="no-print" readonly onclick="this.select()" style="width:100%; margin-top:8px; min-height:62px; font-family:monospace; font-size:0.75rem; padding:6px 8px; border:1px solid #cbd5e1; border-radius:6px; background:#f8fafc;">' + escHtml(tokStr) + '</textarea>' +
      '</div>';
  }

  html += '<div class="cam-header"><div class="cam-header-top"><div>' +
    '<div class="cam-title">Cambridge IGCSE™ Chemistry (0620) — Past-Paper Skills Test</div>' +
    '<div class="cam-sub">' + escHtml(p.label) + ' • ' + escHtml(p.subtitle) + ' • Syllabus 2026–2028</div></div>' +
    '<div style="text-align:right; font-size:0.86rem; white-space:nowrap; flex-shrink:0;">' +
    '<div><strong>Total Marks: ' + totalMarks + '</strong></div>' +
    '<div>Time Allowed: <strong>' + state.timeMinutes + ' mins</strong></div></div></div>' +
    '<div class="cam-meta-grid">' +
    '<div><strong>Candidate Name:</strong> <span id="hdrName">' + sName + '</span></div>' +
    '<div><strong>Date:</strong> ' + escHtml(state.examDate) + '</div>' +
    '<div><strong>Current School:</strong> <span id="hdrSchool">' + sSchool + '</span></div>' +
    '<div><strong>Paper Code:</strong> Set B — ' + p.id + '</div></div>' +
    '<div class="cam-instructions"><strong>READ THESE INSTRUCTIONS FIRST:</strong> Answer all questions in clear scientific English. Show all working in calculations (3 s.f. where appropriate).</div></div>';

  p.questions.forEach(q => {
    const partsHtml = q.parts.map((pt, idx) => {
      const rkey = p.id + "_q" + q.qNo + "_" + idx;
      const savedVal = state.answers[rkey] || "";
      const tierCls = pt.tier === "Core" ? "badge-core" : (pt.tier === "Ext" ? "badge-ext" : "badge-atp");
      return '<div class="subpart"><div class="subpart-head"><span><strong>' + pt.lbl + '</strong> ' + pt.text + '</span>' +
        '<span class="q-meta"><span class="badge badge-ao">' + pt.ao + '</span><span class="badge ' + tierCls + '">[' + pt.tier + ']</span><span class="marks-tag">[' + pt.marks + ']</span></span></div>' +
        '<textarea class="online-ta" ' + (state.submitted ? "readonly" : "") + ' placeholder="Nhập bài làm / phương trình / tính toán..." oninput="setTextAnswer(\'' + rkey + '\', this.value)">' + escHtml(savedVal) + '</textarea>' +
        '<div class="print-ans" id="pa_' + rkey + '">' + (escHtml(savedVal) || "(No written answer)") + '</div></div>';
    }).join("");
    html += '<div class="q-card"><div class="q-head"><div class="q-num">Question ' + q.qNo + ' — ' + q.title + '</div>' +
      '<div class="q-meta"><span class="badge badge-src">' + q.source + '</span><span class="marks-tag">[Total: ' + q.totalMarks + ']</span></div></div>' +
      (q.svg ? '<div class="svg-wrap">' + SVGS[q.svg] + '</div>' : "") + partsHtml + '</div>';
  });

  if (state.showPT) html += renderPT();
  if (state.showQA) html += renderQA();
  document.getElementById("paperSheet").innerHTML = html;
  updateTimerDisplays();
}

function restoreDraft() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (!d || typeof d !== "object") return;
    if (typeof d.studentName === "string") {
      state.studentName = d.studentName;
      document.getElementById("stName").value = d.studentName;
    }
    if (typeof d.studentSchool === "string") {
      state.studentSchool = d.studentSchool;
      document.getElementById("stSchool").value = d.studentSchool;
    }
    if (d.answers && typeof d.answers === "object") state.answers = d.answers;
    state.startedAt = d.startedAt || null;
    state.deadlineAt = d.deadlineAt || null;
    state.elapsedSeconds = Number(d.elapsedSeconds || 0);
    state.tokenCopied = !!d.tokenCopied;
    state.timedOut = !!d.timedOut;
    if (d.submitted) {
      state.submitted = true;
      const stBtn = document.getElementById("btnStSubmit");
      if (stBtn) { stBtn.disabled = true; stBtn.textContent = "✅ Đã nộp bài"; }
      const startBtn = document.getElementById("btnStStartTimer");
      if (startBtn) startBtn.classList.add("hidden");
      document.getElementById("stName").readOnly = true;
      document.getElementById("stSchool").readOnly = true;
      showToast("Đã khôi phục bài làm đã nộp từ máy.");
    } else if (state.startedAt && state.deadlineAt) {
      const now = Date.now();
      if (now >= state.deadlineAt) {
        state.timerSeconds = 0;
        state.elapsedSeconds = state.timeMinutes * 60;
        submitOnlineExam(true);
      } else {
        startStudentTimer();
        showToast("Đã khôi phục bài làm đã lưu tự động!");
      }
    } else if (Object.keys(state.answers).length > 0) {
      showToast("Đã khôi phục bài làm đã lưu tự động!");
    }
  } catch (e) {}
}

function initStudent() {
  parseUrlParams();
  document.getElementById("btnJumpPT").classList.toggle("hidden", !state.showPT);
  document.getElementById("btnJumpQA").classList.toggle("hidden", !state.showQA);
  document.getElementById("stName").oninput = e => {
    state.studentName = e.target.value;
    saveDraft();
    const h = document.getElementById("hdrName");
    if (h) h.textContent = state.studentName || "___________________________________";
  };
  document.getElementById("stSchool").oninput = e => {
    state.studentSchool = e.target.value;
    saveDraft();
    const h = document.getElementById("hdrSchool");
    if (h) h.textContent = state.studentSchool || "_________________________";
  };
  restoreDraft();
  renderPaper();
}

initStudent();
